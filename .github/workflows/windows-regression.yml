name: Windows Regression Gate

on:
  pull_request:
    branches:
      - main

jobs:
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha }}'
          $actual = git rev-parse HEAD
          Write-Host "Expected HEAD: $expected"
          Write-Host "Actual HEAD:   $actual"
          if ($actual -ne $expected) { throw "Exact-head mismatch" }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m playwright install chromium

      - name: Recovery targeted suite
        shell: pwsh
        run: python -m pytest -q tests/test_v6120_profile_reliability.py tests/test_v6124_mention_adapter.py tests/test_submit_timeout_truth.py tests/test_v6123_composer_transaction.py tests/test_sheet_sync.py tests/test_audit_v582.py tests/test_v610_stability.py

      - name: Full regression
        shell: pwsh
        run: python -m pytest -q
