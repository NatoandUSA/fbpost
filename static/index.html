<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Automation Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>FB Automation</h1>
            <div id="auth-status" class="status-badge checking">Checking status...</div>
        </header>
        
        <main>
            <div class="panel compose-panel">
                <div class="tabs">
                    <button class="tab active" data-target="group">Group</button>
                    <button class="tab" data-target="page">Page</button>
                    <button class="tab" data-target="thread">Thread</button>
                </div>
                
                <div class="composer">
                    <!-- Input Mode Switcher -->
                    <div class="input-mode-switcher">
                        <label>
                            <input type="radio" name="inputMode" value="manual" checked> Manual Entry
                        </label>
                        <label>
                            <input type="radio" name="inputMode" value="csv"> Google Sheets CSV
                        </label>
                    </div>

                    <!-- Manual Input Section -->
                    <div id="manual-section">
                        <div class="input-group">
                            <label id="target-label" for="target-input">Group URLs (One per line)</label>
                            <textarea id="target-input" rows="4" placeholder="https://facebook.com/groups/123&#10;https://facebook.com/groups/456"></textarea>
                        </div>
                        
                        <div class="input-group" style="margin-top: 1.25rem;">
                            <label for="post-content">Message Content (Supports Spintax: {Hi|Hello})</label>
                            <textarea id="post-content" rows="6" placeholder="Write something..."></textarea>
                        </div>
                    </div>

                    <!-- CSV Input Section -->
                    <div id="csv-section" class="hidden">
                        <div class="input-group">
                            <label for="csv-url">Google Sheets Public CSV URL</label>
                            <input type="text" id="csv-url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
                            <small style="color: var(--text-secondary); margin-top: 0.5rem; display: block;">
                                Format: Column A (Target URL/ID), Column B (Content), Column C (Image Path - Optional)
                            </small>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button id="auth-btn" class="btn secondary hidden">Authenticate (Login)</button>
                        <button id="post-btn" class="btn primary">Post Now</button>
                    </div>
                </div>
            </div>

            <div class="panel log-panel">
                <div class="log-header">
                    <h3>Live Console</h3>
                    <button id="clear-log" class="btn ghost">Clear</button>
                </div>
                <div id="log-output" class="log-output"></div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
